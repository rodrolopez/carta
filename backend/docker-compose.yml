services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: ${DB_USER:?Define DB_USER in backend/.env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD in backend/.env}
      POSTGRES_DB: ${DB_NAME:?Define DB_NAME in backend/.env}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  minio:
    image: cgr.dev/chainguard/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?Define MINIO_ACCESS_KEY in backend/.env}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?Define MINIO_SECRET_KEY in backend/.env}
    ports:
      - "9005:9000" # API
      - "9006:9001" # Consola web
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  miniodata:
